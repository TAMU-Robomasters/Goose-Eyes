nodes:
  - id: cameraDetector
    path: ../nodes/autoaim/lightDetector.py
    outputs:
      - image
      - points

  - id: displayer
    path: ../nodes/camera_sub.py
    inputs:
      image: cameraDetector/image
      points: cameraDetector/points


  - id: circlet_test
    path: ../nodes/circlet/circlet_test.py
    outputs:
      - auto-aim-locked


  - id: circlet
    path: ../nodes/circlet.py
    inputs:
      - circlet_test/auto-aim-locked
