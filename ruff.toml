# Ruff settings; the ruff binary itself is pinned in pixi.toml ([feature.lint]).
# `pixi run lint` / `pixi run fmt` locally, same commands in .github/workflows/ci.yml.
target-version = "py312"

# goose-eyes/ros2/ holds ROS 2 workspaces pulled in as git submodules (sentry-nav); they follow their own
# repo's style and CI, so Goose Eyes' lint skips them.
extend-exclude = ["goose-eyes/ros2"]
