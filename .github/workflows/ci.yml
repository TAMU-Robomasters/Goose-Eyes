name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch/PR cancels the still-running CI for the old commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# pixi.toml only declares the `jetson` (linux-aarch64, glibc 2.39) and `osx-arm64` platforms, so
# `pixi install` refuses x86 `ubuntu-latest`. ubuntu-24.04-arm is aarch64 + glibc 2.39 and resolves
# to the existing `jetson` lock entry with no lockfile change.
jobs:
  lint:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: lint   # ruff only (no-default-feature) — no ROS / dora solve
          locked: true        # allow lint env install even when other workspace envs change
          cache: true

      - name: ruff check
        run: pixi run lint

      - name: ruff format --check
        run: pixi run fmt

  docs:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: docs
          locked: true
          cache: true

      # mkdocs build --strict, after docs-gen regenerates docs/generated/ from `dora graph`.
      - name: mkdocs build
        run: pixi run docs

      # docs-gen output is checked in; fail if a dataflow changed without re-running it.
      - name: generated docs are up to date
        run: git diff --exit-code -- docs/generated/
